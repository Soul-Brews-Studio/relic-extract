# EXAMPLE — the relic5 team in the .herdr/team.yaml schema (see SPEC.md).
# The real file belongs at Soul-Brews-Studio/relic5/.herdr/team.yaml,
# committed by relic5's own agent. Kept here only as a worked example.
session: relic5
layout: fib
desk: relic5
members:
  - name: relic5
    repo: Soul-Brews-Studio/relic5
    role: hub            # indexes + serves; folds on (msgkey, chunk)
  - name: relic-extract
    repo: Soul-Brews-Studio/relic-extract
    role: extract        # step 2 — clean + chunk + embed-key; writes parts
  - name: relic4-scan
    repo: Soul-Brews-Studio/relic4-scan
    role: scan           # step 1 — raw scan; owns msgkey (agent-relic-v4 sql.py)
